<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Expensio — Track Smarter</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:        #0d0f14;
    --surface:   #141720;
    --surface2:  #1c2030;
    --border:    #272c3d;
    --gold:      #c9a84c;
    --gold-dim:  #8a6e2f;
    --gold-glow: rgba(201,168,76,0.15);
    --text:      #e8e4d9;
    --muted:     #6b7280;
    --danger:    #e05a5a;
    --success:   #4caf7d;
    --radius:    14px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── NOISE OVERLAY ─────────────────── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
    opacity: 0.5;
  }

  /* ── AMBIENT ORBS ───────────────────── */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .orb1 { width: 420px; height: 420px; background: rgba(201,168,76,0.07); top: -120px; left: -100px; }
  .orb2 { width: 360px; height: 360px; background: rgba(76,175,125,0.05); bottom: -80px; right: -80px; animation-delay: -9s; }

  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(30px, 40px) scale(1.06); }
  }

  /* ── LAYOUT ────────────────────────── */
  .wrapper {
    position: relative; z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  /* ── HEADER ─────────────────────────── */
  header {
    text-align: center;
    margin-bottom: 52px;
    animation: fadeUp 0.7s ease both;
  }
  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.6rem, 6vw, 4rem);
    font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(135deg, #e8e4d9 30%, var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .tagline {
    margin-top: 10px;
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* ── CARD ───────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 20px;
    animation: fadeUp 0.7s ease both;
  }
  .card:nth-child(2) { animation-delay: 0.08s; }
  .card:nth-child(3) { animation-delay: 0.16s; }

  /* ── FORM ───────────────────────────── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 8px; }
  label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    padding: 13px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input::placeholder { color: var(--muted); }
  input:focus {
    border-color: var(--gold-dim);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  .btn-add {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--gold-dim), var(--gold));
    border: none;
    border-radius: 8px;
    color: #0d0f14;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn-add::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0.12), transparent);
    pointer-events: none;
  }
  .btn-add:hover  { opacity: 0.92; box-shadow: 0 6px 24px rgba(201,168,76,0.28); transform: translateY(-1px); }
  .btn-add:active { transform: translateY(0); opacity: 1; }
  .btn-add:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ── TOTALS ─────────────────────────── */
  .totals-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .total-chip {
    flex: 1;
    min-width: 120px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
  }
  .total-chip .chip-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .total-chip .chip-value {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--gold);
  }
  .total-chip .chip-value span { font-size: 1.1rem; margin-right: 2px; opacity: 0.7; }
  .total-chip.count .chip-value { color: var(--text); font-size: 1.8rem; }

  /* ── LIST ───────────────────────────── */
  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  #expenselist {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .expense-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    animation: slideIn 0.3s ease both;
    transition: border-color 0.2s;
  }
  .expense-item:hover { border-color: var(--border); }

  .item-icon {
    width: 38px; height: 38px;
    border-radius: 8px;
    background: var(--gold-glow);
    border: 1px solid rgba(201,168,76,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .item-info { flex: 1; min-width: 0; }
  .item-title {
    font-size: 0.95rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .item-index {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  .item-amount {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--gold);
    white-space: nowrap;
    margin-right: 4px;
  }

  .item-actions { display: flex; gap: 6px; }
  .btn-icon {
    width: 34px; height: 34px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.18s, border-color 0.18s, transform 0.12s;
    color: var(--muted);
  }
  .btn-icon:hover { transform: scale(1.08); }
  .btn-edit:hover  { background: rgba(201,168,76,0.12); border-color: var(--gold-dim); color: var(--gold); }
  .btn-del:hover   { background: rgba(224,90,90,0.12);  border-color: var(--danger);    color: var(--danger); }

  /* ── EMPTY STATE ─────────────────────── */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 2.4rem; margin-bottom: 12px; opacity: 0.5; }
  .empty p { font-size: 0.9rem; }

  /* ── INLINE EDIT MODAL ───────────────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    width: min(440px, calc(100vw - 40px));
    transform: translateY(20px) scale(0.97);
    transition: transform 0.25s cubic-bezier(.22,1,.36,1);
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }
  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    margin-bottom: 20px;
    color: var(--text);
  }
  .modal .form-grid { margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; }
  .btn-cancel {
    flex: 1;
    padding: 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-cancel:hover { border-color: var(--muted); color: var(--text); }
  .btn-save {
    flex: 2;
    padding: 12px;
    background: linear-gradient(135deg, var(--gold-dim), var(--gold));
    border: none;
    border-radius: 8px;
    color: #0d0f14;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }
  .btn-save:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ── TOAST ──────────────────────────── */
  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 0.85rem;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    transition: transform 0.35s cubic-bezier(.22,1,.36,1), opacity 0.3s;
    opacity: 0;
    z-index: 100;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ── ANIMATIONS ─────────────────────── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(0,0,0,0.3);
    border-top-color: #0d0f14;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="wrapper">

  <!-- HEADER -->
  <header>
    <p class="eyebrow">Personal Finance</p>
    <h1>Expensio</h1>
    <p class="tagline">Every rupee accounted for — elegantly.</p>
  </header>

  <!-- TOTALS -->
  <div class="card" style="animation-delay:0s">
    <div class="totals-row">
      <div class="total-chip">
        <div class="chip-label">Total Spent</div>
        <div class="chip-value"><span>₹</span><span id="total">0</span></div>
      </div>
      <div class="total-chip count">
        <div class="chip-label">Entries</div>
        <div class="chip-value" id="count">0</div>
      </div>
      <div class="total-chip">
        <div class="chip-label">Average</div>
        <div class="chip-value"><span>₹</span><span id="avg">0</span></div>
      </div>
    </div>
  </div>

  <!-- ADD FORM -->
  <div class="card" style="animation-delay:0.08s">
    <div class="form-grid">
      <div class="field">
        <label for="title">Expense Title</label>
        <input id="title" type="text" placeholder="e.g. Coffee, Rent…" autocomplete="off"/>
      </div>
      <div class="field">
        <label for="amount">Amount (₹)</label>
        <input id="amount" type="number" placeholder="0.00" min="0" step="0.01"/>
      </div>
    </div>
    <button class="btn-add" id="btn-add" onclick="addExpense()">＋ &nbsp;Add Expense</button>
  </div>

  <!-- LIST -->
  <div class="card" style="animation-delay:0.16s">
    <div class="section-label">Transactions</div>
    <ul id="expenselist">
      <div class="empty">
        <div class="empty-icon">🪙</div>
        <p>Loading expenses…</p>
      </div>
    </ul>
  </div>

</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2>Edit Expense</h2>
    <div class="form-grid">
      <div class="field">
        <label for="edit-title">Expense Title</label>
        <input id="edit-title" type="text" autocomplete="off"/>
      </div>
      <div class="field">
        <label for="edit-amount">Amount (₹)</label>
        <input id="edit-amount" type="number" min="0" step="0.01"/>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="btn-save" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <div class="toast-dot" id="toast-dot"></div>
  <span id="toast-msg"></span>
</div>

<script>
  // ── CONFIG ───────────────────────────────────────────────────────────────────
  const API_BASE = 'expensetracker-production-443d.up.railway.app';

  // ── STATE ─────────────────────────────────────────────────────────────────────
  let expenses = [];
  let editingId = null;

  const ICONS = ['🛒','🍕','🚗','✈️','📱','💊','🎮','🏠','📚','☕','🧾','💡'];
  function randomIcon() { return ICONS[Math.floor(Math.random() * ICONS.length)]; }

  // ── TOAST ─────────────────────────────────────────────────────────────────────
  function showToast(msg, color = '#4caf7d') {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    document.getElementById('toast-dot').style.background = color;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  // ── API HELPERS ───────────────────────────────────────────────────────────────
  async function apiFetch(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    // DELETE returns no body
    if (res.status === 204 || options.method === 'DELETE') return null;
    return res.json();
  }

  // ── LOAD ALL EXPENSES ─────────────────────────────────────────────────────────
  async function loadExpenses() {
    try {
      const data = await apiFetch('/expense');
      // Preserve icons for items we already know; assign new ones for fresh entries
      const iconMap = {};
      expenses.forEach(e => { iconMap[e.id] = e.icon; });
      expenses = data.map(e => ({
        ...e,
        amount: Number(e.amount),
        icon: iconMap[e.id] || randomIcon()
      }));
      displayExpenses();
    } catch (err) {
      showToast('Could not reach the server.', '#e05a5a');
      displayExpenses(); // show whatever we have
    }
  }

  // ── ADD EXPENSE ───────────────────────────────────────────────────────────────
  async function addExpense() {
    const titleInput  = document.getElementById('title');
    const amountInput = document.getElementById('amount');
    const title  = titleInput.value.trim();
    const amount = amountInput.value.trim();

    if (!title || !amount) {
      showToast('Please fill in both fields.', '#e05a5a');
      return;
    }
    if (Number(amount) <= 0) {
      showToast('Amount must be greater than 0.', '#e05a5a');
      return;
    }

    const btn = document.getElementById('btn-add');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Adding…';

    try {
      const created = await apiFetch('/expense', {
        method: 'POST',
        body: JSON.stringify({ title, amount: parseInt(amount) })
      });
      expenses.push({ ...created, amount: Number(created.amount), icon: randomIcon() });
      displayExpenses();
      titleInput.value  = '';
      amountInput.value = '';
      titleInput.focus();
      showToast(`"${title}" added successfully.`);
    } catch {
      showToast('Failed to add expense.', '#e05a5a');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '＋ &nbsp;Add Expense';
    }
  }

  // ── DISPLAY LIST ──────────────────────────────────────────────────────────────
  function displayExpenses() {
    const list = document.getElementById('expenselist');
    list.innerHTML = '';

    if (expenses.length === 0) {
      list.innerHTML = `<div class="empty"><div class="empty-icon">🪙</div><p>No expenses yet. Add one above.</p></div>`;
      updateTotals(0, 0);
      return;
    }

    let total = 0;
    expenses.forEach((expense, index) => {
      total += expense.amount;
      const li = document.createElement('li');
      li.className = 'expense-item';
      li.style.animationDelay = `${index * 0.04}s`;
      li.innerHTML = `
        <div class="item-icon">${expense.icon}</div>
        <div class="item-info">
          <div class="item-title">${escHtml(expense.title)}</div>
          <div class="item-index">#${String(index + 1).padStart(2,'0')}</div>
        </div>
        <div class="item-amount">₹${expense.amount.toFixed(2)}</div>
        <div class="item-actions">
          <button class="btn-icon btn-edit" onclick="editExpense(${expense.id})" title="Edit">✎</button>
          <button class="btn-icon btn-del"  onclick="deleteExpense(${expense.id})" title="Delete">✕</button>
        </div>
      `;
      list.appendChild(li);
    });

    updateTotals(total, expenses.length);
  }

  // ── TOTALS ────────────────────────────────────────────────────────────────────
  function updateTotals(total, count) {
    document.getElementById('total').textContent = total.toFixed(2);
    document.getElementById('count').textContent = count;
    document.getElementById('avg').textContent   = count ? (total / count).toFixed(2) : '0';
  }

  // ── DELETE EXPENSE ────────────────────────────────────────────────────────────
  async function deleteExpense(id) {
    const expense = expenses.find(e => e.id === id);
    if (!expense) return;

    try {
      await apiFetch(`/expense/${id}`, { method: 'DELETE' });
      expenses = expenses.filter(e => e.id !== id);
      displayExpenses();
      showToast(`"${expense.title}" removed.`, '#e05a5a');
    } catch {
      showToast('Failed to delete expense.', '#e05a5a');
    }
  }

  // ── EDIT EXPENSE (modal) ──────────────────────────────────────────────────────
  function editExpense(id) {
    const expense = expenses.find(e => e.id === id);
    if (!expense) return;
    editingId = id;
    document.getElementById('edit-title').value  = expense.title;
    document.getElementById('edit-amount').value = expense.amount;
    document.getElementById('edit-modal').classList.add('open');
    setTimeout(() => document.getElementById('edit-title').focus(), 50);
  }

  function closeModal() {
    document.getElementById('edit-modal').classList.remove('open');
    editingId = null;
  }

  async function saveEdit() {
    const newTitle  = document.getElementById('edit-title').value.trim();
    const newAmount = document.getElementById('edit-amount').value.trim();

    if (!newTitle || isNaN(Number(newAmount)) || Number(newAmount) <= 0) {
      showToast('Invalid input — no changes made.', '#e05a5a');
      return;
    }

    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Saving…';

    try {
      const updated = await apiFetch(`/expense/${editingId}`, {
        method: 'PUT',
        body: JSON.stringify({ title: newTitle, amount: parseInt(newAmount) })
      });
      const idx = expenses.findIndex(e => e.id === editingId);
      if (idx !== -1) {
        expenses[idx] = { ...expenses[idx], ...updated, amount: Number(updated.amount) };
      }
      displayExpenses();
      showToast(`"${newTitle}" updated.`, '#c9a84c');
      closeModal();
    } catch {
      showToast('Failed to update expense.', '#e05a5a');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Save Changes';
    }
  }

  // ── UTILS ─────────────────────────────────────────────────────────────────────
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── KEYBOARD SHORTCUTS ────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (document.activeElement.id === 'title' || document.activeElement.id === 'amount')) {
      addExpense();
    }
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && (document.activeElement.id === 'edit-title' || document.activeElement.id === 'edit-amount')) {
      saveEdit();
    }
  });

  // Close modal on overlay click
  document.getElementById('edit-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // ── INIT ──────────────────────────────────────────────────────────────────────
  loadExpenses();
</script>
</body>
</html>
